name: Publier les fiches techniques

on:
  schedule:
    # 3 mises à jour par jour (heures UTC) : ~5h, 12h et 17h à Paris
    - cron: "0 3 * * *"
    - cron: "0 10 * * *"
    - cron: "0 15 * * *"
  workflow_dispatch:        # bouton « Run workflow » pour publier immédiatement
    inputs:
      reset_cache:
        description: "Tout retraiter (photos et vidéos) — plus long"
        type: boolean
        default: false

concurrency:
  group: publier-fiches
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: |
          pip install -r requirements.txt
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Restaurer le cache des médias
        if: ${{ !inputs.reset_cache }}
        uses: actions/cache/restore@v4
        with:
          path: .cache
          key: medias-${{ github.run_id }}
          restore-keys: medias-

      - name: Générer le site depuis Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python build.py

      - name: Enregistrer le cache des médias
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache
          key: medias-${{ github.run_id }}

      - name: Publier sur Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@3.114.0 pages project create mcz-fiches --production-branch main 2>/dev/null || true
          npx --yes wrangler@3.114.0 pages deploy out --project-name mcz-fiches --branch main --commit-dirty=true
